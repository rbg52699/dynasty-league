name: Sync lock-in scores
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/sync.py", ".github/workflows/sync.yml"]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull lock-in data from Sleeper
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
        run: python3 scripts/sync.py
      - name: Save changes
        run: |
          git config user.name "league-sync"
          git config user.email "league-sync@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "Sync lock-in scores"
          git pull -q --rebase origin main && git push -q
