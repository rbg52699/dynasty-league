name: Sync lock-in scores
# Started every 5 minutes (GitHub's minimum, often delayed); each run keeps
# re-checking Sleeper about once a minute for ~55 minutes, so syncing is
# continuous even when GitHub's schedule is late. Data goes to the `data` branch so the site itself
# doesn't rebuild on every update.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sync.py", ".github/workflows/sync.yml"]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch
        run: |
          git fetch -q origin data
          git worktree add -q store FETCH_HEAD
          cd store && git checkout -q -B data
      - name: Sync about once a minute
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
        run: |
          cd store
          git config user.name "league-sync"
          git config user.email "league-sync@users.noreply.github.com"
          end=$((SECONDS + 3300))
          while :; do
            python3 ../scripts/sync.py || echo "sync failed, will retry"
            git add data
            if ! git diff --cached --quiet; then
              git commit -qm "Sync lock-in scores"
              git push -q origin data || (git pull -q --rebase origin data && git push -q origin data) || true
            fi
            [ $SECONDS -ge $end ] && break
            sleep 50
          done
