name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          T: ${{ secrets.SLEEPER_TOKEN }}
        run: |
          mkdir -p probe; rm -f probe/*
          q() { curl -s -H Content-Type:application/json -H "Authorization: $T" -H Origin:https://sleeper.com -X POST https://sleeper.com/graphql --data "$2" > probe/$1.json; }
          q score_type '{"query":"{ __type(name: \"Score\") { fields { name } } }"}'
          q scores '{"query":"query q { scores(sport: \"nba\", season_type: \"regular\", season: \"2026\", week: 1) { game_id date status start_time metadata } }"}'
          head -c 800 probe/*.json
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm probe || true; git pull -q --rebase origin main; git push -q
