name: Sleeper data snapshot
on:
  push:
    paths: [".github/workflows/snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Sleeper GraphQL
        run: |
          mkdir -p debug/probe2
          G=https://sleeper.com/graphql
          q() { curl -s -H Content-Type:application/json -H Origin:https://sleeper.com -X POST $G --data "$2" > debug/probe2/$1.json; }
          q type_leg '{"query":"{ __type(name: \"MatchupLeg\") { fields { name type { name kind of_type { name kind } } } } }"}'
          q legs2 '{"query":"query q { matchup_legs(league_id: \"1342346419675078656\", round: 2) { roster_id matchup_id leg round points proj_points max_points starters starters_games player_map } }"}'
          q legs1 '{"query":"query q { matchup_legs(league_id: \"1342346419675078656\", round: 1) { roster_id matchup_id points starters starters_games } }"}'
          q legs_prev '{"query":"query q { matchup_legs(league_id: \"1207385949281984512\", round: 5) { roster_id matchup_id points starters starters_games } }"}'
          q type_q '{"query":"{ __schema { query_type { fields { name args { name } } } } }"}'
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add debug; git commit -m "Sleeper probe" || true; git push
