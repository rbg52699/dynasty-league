name: Sleeper data snapshot
on:
  push:
    paths: [".github/workflows/snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Sleeper GraphQL
        run: |
          mkdir -p debug/probe3
          G=https://sleeper.com/graphql
          q() { curl -s -H Content-Type:application/json -H Origin:https://sleeper.com -X POST $G --data "$2" > debug/probe3/$1.json; }
          q events '{"query":"query q { league_event_logs(league_id: \"1342346419675078656\", limit: 200) }"}'
          q events_type '{"query":"{ __type(name: \"LeagueEventLog\") { fields { name } } }"}'
          q ql_args '{"query":"{ __schema { query_type { fields { name type { name kind of_type { name } } } } } }"}'
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add debug; git commit -m "Sleeper probe" || true; git push
