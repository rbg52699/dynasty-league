name: Sleeper data snapshot
on:
  push:
    paths: [".github/workflows/snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Sleeper GraphQL
        run: |
          mkdir -p debug/probe
          G=https://sleeper.com/graphql
          H='-H Content-Type:application/json -H Origin:https://sleeper.com -H Referer:https://sleeper.com/'
          curl -s $H -X POST $G -d '{"query":"{ __schema { queryType { fields { name args { name } } } } }"}' > debug/probe/schema.json || true
          curl -s $H -X POST $G -d '{"operationName":"q","variables":{},"query":"query q { matchup_legs(league_id: \"1342346419675078656\", round: 2) { roster_id points starters starters_points player_map } }"}' > debug/probe/legs.json || true
          curl -s $H -X POST $G -d '{"operationName":"q","variables":{},"query":"query q { league_rosters(league_id: \"1342346419675078656\") { roster_id settings } }"}' > debug/probe/rosters.json || true
          curl -s https://api.sleeper.com/league/1342346419675078656/matchups/2 > debug/probe/apicom_matchups.json || true
          head -c 600 debug/probe/*.json
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add debug; git commit -m "Sleeper probe" || true; git push
