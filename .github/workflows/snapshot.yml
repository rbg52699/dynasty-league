name: Sleeper data snapshot
on:
  push:
    paths: [".github/workflows/snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download raw league data
        run: |
          set -e
          mkdir -p debug
          API=https://api.sleeper.app/v1
          ID=1342346419675078656
          curl -sf $API/state/nba > debug/state.json
          i=0
          while [ -n "$ID" ] && [ "$ID" != "null" ] && [ "$ID" != "0" ] && [ $i -lt 10 ]; do
            d=debug/league_$ID; mkdir -p $d
            curl -sf $API/league/$ID > $d/league.json
            curl -sf $API/league/$ID/users > $d/users.json
            curl -sf $API/league/$ID/rosters > $d/rosters.json
            curl -sf $API/league/$ID/winners_bracket > $d/winners_bracket.json || true
            for w in 1 2 3 4; do curl -sf $API/league/$ID/matchups/$w > $d/matchups_$w.json || true; done
            ID=$(jq -r '.previous_league_id' $d/league.json); i=$((i+1))
          done
      - name: Commit snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add debug
          git commit -m "Sleeper data snapshot" || echo "nothing to commit"
          git push
